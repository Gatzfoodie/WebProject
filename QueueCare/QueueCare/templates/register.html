{% extends "base.html" %}
{% block title %}Register – QueueCare{% endblock %}
{% block content %}
<form method="post" class="card form">
  <h2>Create Patient Account</h2>
  <label>Full name<input name="name" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>Phone<input name="phone" placeholder="09XXXXXXXXX"></label>
  <label>Password (min 6 characters)<input type="password" name="password" minlength="6" required></label>
  <button class="btn">Register</button>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</form>
{% endblock %}
